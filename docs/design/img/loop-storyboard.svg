<rect class="amber" x="44" y="90" width="3" height="30"/>
<line x1="68" y1="200" x2="68" y2="28" stroke="#1D9E75" stroke-width="2.5"/>
<rect class="teal" x="61" y="200" width="14" height="5"/>
<rect class="teal" x="61" y="20" width="14" height="8"/>
<rect class="cube" x="190" y="174" width="26" height="26"/>
<g stroke="#444441" stroke-width="1.8" fill="none" stroke-linecap="round"><circle cx="150" cy="160" r="6"/><line x1="150" y1="166" x2="150" y2="182"/><line x1="150" y1="182" x2="144" y2="200"/><line x1="150" y1="182" x2="156" y2="200"/><line x1="150" y1="171" x2="142" y2="181"/><line x1="150" y1="171" x2="158" y2="181"/></g>
<text class="ts" x="155" y="226" text-anchor="middle">1. Луч доходит до приёмника:</text>
<text class="ts" x="155" y="242" text-anchor="middle">поле выключено, кнопка пуста</text>
</g>
<g transform="translate(355,20)">
