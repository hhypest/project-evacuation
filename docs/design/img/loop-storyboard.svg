<svg xmlns="http://www.w3.org/2000/svg" width="680" height="565" viewBox="0 0 680 565" role="img">
<title>Раскадровка решения камеры «Петля»</title>
<desc>1: луч доходит до приёмника, поле выключено. 2: игрок с кубом встаёт в луч, поле включается, игрок на стене. 3: игрок поднимается по стене и кладёт куб на кнопку в луче. 4: куб перекрывает луч, поле держит куб, дверь открыта.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.ts{font-size:12px;fill:#444441}.box{fill:#FFFFFF;stroke:#D3D1C7}.field{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.6}.wall{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}.rib{fill:#D3D1C7;stroke:#5F5E5A;stroke-width:0.5}.amber{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.5}.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.cube{fill:#F1EFE8;stroke:#444441;stroke-width:0.8}</style>
<rect width="680" height="565" fill="#FFFFFF"/>
<g transform="translate(15,20)">
