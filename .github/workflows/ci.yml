name: Foundation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Documentation links and migration compatibility
        run: python3 tools/check_docs.py
      - name: Cache pinned Godot archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            work/Godot_v*_linux.x86_64.zip
            work/Godot_v*_export_templates.tpz
          key: godot-${{ runner.os }}-${{ hashFiles('tools/toolchain.json') }}
      - name: Install pinned Standard editor
        shell: pwsh
        run: |
          $binary = ./tools/setup.ps1 -SkipTemplates
          "GODOT_BIN=$binary" >> $env:GITHUB_ENV
      - name: Types, layers, unit, contracts, Jolt and regressions
        shell: pwsh
        run: ./tools/check.ps1
      - name: Install matching export templates
        shell: pwsh
        run: |
          ./tools/setup.ps1
      - name: Windows and Linux release exports
        shell: pwsh
        run: ./tools/export.ps1
      - name: Linux exported runtime smoke (CPU only)
        shell: pwsh
        run: |
          chmod +x builds/evacuation.x86_64
          if ($LASTEXITCODE -ne 0) { throw 'chmod failed' }
          $output = (& timeout 120 ./builds/evacuation.x86_64 --headless --fixed-fps 144 -- --runtime-smoke 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $output -match '(SCRIPT ERROR:|ERROR:|WARNING:)' -or $output -notmatch 'EXPORTED_GAMEPLAY_SMOKE_PASSED') { throw $output }
          Write-Output $output
          $negative = (& timeout 30 ./builds/evacuation.x86_64 --headless -- --runtime-smoke --self-test-failure 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 1 -or $negative -notmatch 'intentional smoke failure') { throw $negative }
      - name: Windows distribution with provenance and notices
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evacuation-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            builds/evacuation.exe
            builds/evacuation.console.exe
            builds/build-manifest.json
            builds/LICENSE
            builds/THIRD_PARTY_NOTICES.md
            builds/content/licenses/
      - name: Linux distribution with provenance and notices
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evacuation-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            builds/evacuation.x86_64
            builds/build-manifest.json
            builds/LICENSE
            builds/THIRD_PARTY_NOTICES.md
            builds/content/licenses/
